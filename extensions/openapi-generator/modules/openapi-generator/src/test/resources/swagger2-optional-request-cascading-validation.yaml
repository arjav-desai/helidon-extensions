swagger: "2.0"
info:
  title: Swagger 2 optional request cascading validation
  version: "1.0"
basePath: /
paths:
  /child:
    post:
      operationId: createChild
      parameters:
        - name: child
          in: body
          schema:
            $ref: '#/definitions/ConstrainedChild'
      responses:
        "204":
          description: Valid
definitions:
  ConstrainedChild:
    type: object
    properties:
      code:
        type: string
        minLength: 3
